apiVersion: v1
kind: Pod
metadata:
  name: read-file-from-pvc
  labels:
    name: read-file-from-pvc
spec:
  containers:
  - name: file-read
    image: busybox
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    command: ["sleep", "30000"]
    volumeMounts:
      - name: host-vol
        mountPath: /my-path
  volumes:
    - name: host-vol
      persistentVolumeClaim:
        claimName: host-pvc
